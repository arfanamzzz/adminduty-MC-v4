name: AdminDuty
version: '${project.version}'
main: com.arfan.adminduty.AdminDuty
api-version: '1.21'
author: arfan
description: Mode duty untuk OP. Command admin hanya jalan kalau sudah on duty.

commands:
  adminduty:
    description: Toggle ON/OFF duty admin
    usage: /adminduty
    permission: adminduty.use
    aliases: [duty]

permissions:
  adminduty.use:
    description: Boleh pakai /adminduty (hanya OP)
    default: op
